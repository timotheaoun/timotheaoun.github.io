<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langages de Programmation</title>
    <style>
        /* Styles généraux */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
            color: #333;
            display: flex;
            flex-direction: column;
overflow: hidden;         
		 align-items: center;
        }



        header {
            text-align: center;
            padding: 2rem;
			   color: rgba(255, 200, 255, 0.8);
            background: rgba(0, 0, 0, 0.8);
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        p {
            margin: 1rem 0 0;
            font-size: 1.2rem;
        }

        /* Cartes */
        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }

        .card {
            background: white;
            border-radius: 10px;
            margin: 1rem;
            padding: 1.5rem;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, rgba(255, 215, 0, 0.3), rgba(255, 105, 180, 0.3));
            z-index: 0;
            transform: rotate(45deg);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #444;
            position: relative;
            z-index: 1;
        }
		.card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 60%) repeat;
    opacity: 0.2;
    pointer-events: none;
    background-size: 50px 50px;
    z-index: 2;
    animation: sparkle 3s linear infinite;
}

@keyframes sparkle {
    0% {
        background-position: 0 0;
    }
    100% {
        background-position: 100px 100px;
    }
}


        /* Détails */
        #details {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1rem 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: none;
        }

        #details h2 {
            margin-top: 0;
        }

        footer {
            margin-top: auto;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.8);
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Langages de Programmation</h1>
        <p>Découvrez les bases et spécificités des langages de programmation.</p>
    </header>
    <main>
        <div class="cards">
            <div class="card" onclick="showDetails('Python')">
                <h2>Python</h2>
            </div>
            <div class="card" onclick="showDetails('HTML')">
                <h2>HTML</h2>
            </div>
            <div class="card" onclick="showDetails('VBScript')">
                <h2>VBScript</h2>
            </div>
            <div class="card" onclick="showDetails('Batch')">
                <h2>Batch</h2>
            </div>
        </div>
        <div id="details">
            <h2 id="details-title"></h2>
            <p id="details-content"></p>
        </div>
    </main>
    <footer>
        © 2024 Votre Nom. Tous droits réservés.
    </footer>
    <script>
        const details = {
            "Python": "Python est un langage de programmation polyvalent utilisé dans le développement web, la data science, l'intelligence artificielle, et bien plus.",
            "HTML": "HTML (HyperText Markup Language) est le langage standard pour créer des pages web structurées.",
            "VBScript": "VBScript est un langage de script développé par Microsoft, souvent utilisé pour automatiser des tâches sous Windows.",
            "Batch": "Batch est un langage de script pour l'automatisation des tâches sous Windows via des fichiers batch (.bat)."
        };

        function showDetails(language) {
            const title = document.getElementById('details-title');
            const content = document.getElementById('details-content');
            const detailsContainer = document.getElementById('details');

            title.textContent = language;
            content.textContent = details[language];
            detailsContainer.style.display = 'block';
        }
    </script>
</body>
</html>
